name: publish
on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  setup:
    runs-on: ubuntu-latest
    # runs only the branch name starts with 'release/v' and the pull request is merged.
    if: startsWith(github.head_ref, 'releases/v') && github.event.pull_request.merged == true
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Git Tag name
        id: vars
        run: |
          echo "tag=${GITHUB_HEAD_REF##*/v}" >> $GITHUB_OUTPUT

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push tag
        run: |
          git tag v${{ steps.vars.outputs.tag }}
          git push origin v${{ steps.vars.outputs.tag }}

      - name: Create release
        run: |
          gh release create v${{ steps.vars.outputs.tag }} --verify-tag --generate-notes --title "Release v${{ steps.vars.outputs.tag }}" --draft

    #   - name: Create release
    #     id: create_release
    #     uses: actions/create-release@v1.0.0
    #     env:
    #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #     with:
    #       tag_name: v${{ steps.vars.outputs.tag }}
    #       release_name: Release v${{ steps.vars.outputs.tag }}
    #       draft: true
    #       prerelease: false

  publish:
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Create distribution files.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh .github/scripts/make_distribution_files.sh ${{ needs.setup.outputs.tag }}
          sh .github/scripts/upload_assets.sh ${{ needs.setup.outputs.tag }}

    #   - name: Finalize release
    #     run: |
    #       gh release edit v${{ needs.setup.outputs.tag }} --draft=false